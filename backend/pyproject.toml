[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dataforce"
version = "0.1.0"
description = "DataForce: analysis workspace for sales / marketing teams (minimal CRM + verified analytics)"
requires-python = ">=3.12"
dependencies = [
    # DB
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.2",
    "alembic>=1.13",
    # models / config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0",  # config.py reads .env keys to warn about typos
    # network (LLM SDKs, TamTam MCP)
    "httpx>=0.27",
    # LLM / AI providers
    "google-genai>=2.31,<3",
    "anthropic>=1.15,<2",
    "mcp>=2.3,<3",
    # numerics / stats engine
    "numpy>=1.26",
    "scipy>=1.13",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pip-tools>=7.4",  # regenerates the hashed lock files (see README, `make lock`)
]
# The Milestone 1 demo notebook (notebooks/). Not needed by the engine itself.
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
dataforce = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live'"
markers = [
    "integration: needs the Postgres+pgvector test database (docker compose up -d db)",
    "live: hits real external services (LLM APIs, TamTam MCP); run explicitly with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
