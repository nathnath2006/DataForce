# Netlify: the app now runs on Google Cloud Run (docs/HOSTING-PLAN.md, decision S), API and
# interface on one origin. This site only forwards: every path, permanently, to the same path on
# Cloud Run. The build stays so Netlify has something to publish; nothing of it is served.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "https://dataforce-239133496698.europe-west1.run.app/:splat"
  status = 301
  force = true
